# SearXNG interno (acessível apenas pela rede do docker compose).
# Revise os engines habilitados conforme os termos de uso de cada mecanismo.
use_default_settings: true
general:
  instance_name: "VoteMais Leads Search"
search:
  safe_search: 0
  default_lang: "pt-BR"
  formats:
    - html
    - json
server:
  # definido via variável SEARXNG_SECRET
  secret_key: "change-me-via-env"
  limiter: false
  image_proxy: false
  public_instance: false
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
# Mais mecanismos gerais: quando um pede CAPTCHA ou suspende (comum em IPs de nuvem), os outros seguem respondendo.
# Se todos falharem, o VoteMais Leads passa a consulta ao próximo provedor configurado (Tavily, Serper…).
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: yahoo
    disabled: false
  - name: startpage
    disabled: false
  - name: qwant
    disabled: false
  - name: google
    disabled: false
