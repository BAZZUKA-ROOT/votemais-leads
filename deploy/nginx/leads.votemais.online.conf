# Alternativa ao Caddy para quem já usa Nginx no host (sem Docker para o proxy).
# Certificado: certbot --nginx -d leads.votemais.online
server {
    listen 80;
    server_name leads.votemais.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name leads.votemais.online;

    ssl_certificate     /etc/letsencrypt/live/leads.votemais.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leads.votemais.online/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
