name: Imagens Docker
on:
  push:
    branches: [main]
    paths: ["server/**", "web/**", "pnpm-lock.yaml", "package.json", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/bazzuka-root

jobs:
  # Cada arquitetura compila em runner nativo (sem emulação qemu, que é lenta e quebra o build do Next com SIGILL).
  build:
    runs-on: ${{ matrix.arch.runner }}
    # ARM é para quem instala em VPS ARM; se falhar, a imagem x86 é publicada mesmo assim
    continue-on-error: ${{ matrix.arch.name == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        app: [server, web]
        arch:
          - { name: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { name: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          push: true
          provenance: false
          build-args: API_INTERNAL_URL=http://api:4000
          tags: ${{ env.REGISTRY }}/votemais-leads-${{ matrix.app }}:${{ github.sha }}-${{ matrix.arch.name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch.name }}

  # Junta as arquiteturas que compilaram em :latest e :<sha>
  manifest:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [server, web]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar manifest multi-arquitetura
        env:
          IMAGE: ${{ env.REGISTRY }}/votemais-leads-${{ matrix.app }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          srcs=()
          for arch in amd64 arm64; do
            if docker buildx imagetools inspect "$IMAGE:$SHA-$arch" >/dev/null 2>&1; then srcs+=("$IMAGE:$SHA-$arch"); else echo "::warning::$IMAGE sem $arch neste commit"; fi
          done
          printf '%s\n' "${srcs[@]}" | grep -q amd64 || { echo "::error::imagem amd64 ausente"; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$SHA" -t "$IMAGE:latest" "${srcs[@]}"
          docker buildx imagetools inspect "$IMAGE:latest"
